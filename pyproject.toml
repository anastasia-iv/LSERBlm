[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serbian-llm-homework"
version = "0.1.0"
description = "A small Serbian decoder-only LM trained from random initialization"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3", "numpy>=1.26,<3", "tokenizers>=0.20,<1",
  "huggingface_hub>=0.27,<2", "pyarrow>=21,<27", "datasketch>=1.6,<2",
  "tqdm>=4.66,<5", "matplotlib>=3.8,<4", "tensorboard>=2.17,<3"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
serbian-llm = "serbian_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
